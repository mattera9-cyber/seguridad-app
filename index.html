<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen App - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">

  <!-- Librería de animación AOS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>
<body>
  <!-- Navbar Bootstrap -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Citizen App</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/sobre-mi.html">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/proyectos.html">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/servicios.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/faq.html">FAQ</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="main-contenido">
    <section class="seccion-intro">
      <h1 class="titulo-principal" data-aos="fade-down" data-aos-duration="1200">Seguridad Ciudadana App</h1>
      <p class="texto-intro" data-aos="fade-up" data-aos-duration="1200">Una plataforma innovadora que combina seguridad ciudadana con interacción social.</p>
    </section>

    <!-- Carrusel principal con animación AOS -->
    <section class="seccion-galeria">
      <h2 class="titulo-secundario">Imágenes de inicio</h2>
      <div id="carouselInicio" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        
        <!-- Indicadores -->
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Imagen 1"></button>
          <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="1" aria-label="Imagen 2"></button>
          <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="2" aria-label="Imagen 3"></button>
        </div>

        <!-- Slides con animación -->
        <div class="carousel-inner">
          <div class="carousel-item active" data-aos="zoom-in" data-aos-duration="1000">
            <img src="imagenes/inicio1.png" class="d-block w-100" alt="Imagen 1">
          </div>
          <div class="carousel-item" data-aos="zoom-in" data-aos-duration="1000" data-aos-delay="200">
            <img src="imagenes/inicio2.webp" class="d-block w-100" alt="Imagen 2">
          </div>
          <div class="carousel-item" data-aos="zoom-in" data-aos-duration="1000" data-aos-delay="400">
            <img src="imagenes/inicio3.webp" class="d-block w-100" alt="Imagen 3">
          </div>
        </div>

        <!-- Controles -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselInicio" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselInicio" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer-principal">
    <p class="footer-texto">© 2026 - Proyecto Final</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script de inicialización de AOS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
