</head>
<body>
  <!-- Navbar Bootstrap -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Citizen App</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre-mi.html">Sobre mí</a></li>

      </div>
    </div>

  <main class="main-contenido">
    <section class="seccion-contacto container">
      <h1 class="titulo-principal">Contacto</h1>

      <div class="contacto-contenido">
        <!-- Imagen con animación AOS -->
        <figure class="contacto-imagen" data-aos="fade-up" data-aos-duration="1200">
          <img src="../imagenes/contacto.jpg" alt="Icono de contacto">
          <figcaption>Medios de contacto disponibles para los usuarios.</figcaption>
        </figure>

        <!-- Texto -->
        <div class="contacto-texto">
          <h2 class="titulo-secundario">Escríbenos</h2>
          <p class="texto-intro">Podés comunicarte con nuestro equipo a través de los siguientes medios:</p>
          <ul>
            <li>📧 Correo: contacto@seguridadapp.com</li>
            <li>📞 Teléfono: +54 11 1234 5678</li>
          </ul>

      </div>

  <footer class="footer-principal">
    <p class="footer-texto">© 2026 - Proyecto Final</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    AOS.init();
